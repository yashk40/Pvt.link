# Render Blueprint for the Pvt.link backend.
# Provision via: render blueprint launch --repo https://github.com/yashk40/Pvt.link --branch main
services:
  - type: web
    name: pvtlink-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below is `sync: false` (never committed). Values are set on
      # the service after launch via the Render CLI (see render secrets set).
      - key: CLIENT_ORIGINS
        sync: false
      - key: JWT_AGENT_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: IMGHOSTING_API_KEY
        sync: false
